<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gói dịch vụ - Smart Classroom</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <img th:src="@{/image.png}" alt="Smart Classroom" class="sidebar-logo-img">
            
            <nav class="sidebar-nav">
                <a href="/admin/dashboard" class="nav-item">Bảng điều khiển</a>
                <a href="/admin/users" class="nav-item">Ngườii dùng</a>
<!--                <a href="/admin/plans" class="nav-item active">Gói dịch vụ</a>-->
<!--                <a href="/admin/payments" class="nav-item">Thanh toán</a>-->
                <a href="/admin/questions" class="nav-item">Ngân hàng câu hỏi</a>
                <a href="/admin/lessons" class="nav-item">Bài giảng</a>
                <a href="/admin/tests" class="nav-item">Đề thi</a>
                <a href="/admin/classrooms" class="nav-item">Lớp học</a>
                <a href="/admin/ai-history" class="nav-item">Lịch sử AI</a>
                <a href="/admin/profile" class="nav-item">Cài đặt</a>
            </nav>
            
            <div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-ghost" style="width: 100%;">Đăng xuất</button>
                </form>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div class="header-title">Gói dịch vụ</div>
                <div class="header-actions">
                    <a href="/admin/plans/new" class="btn btn-primary">Tạo gói mới</a>
                </div>
            </header>

            <div class="content">
                <!-- Success/Error Messages -->
                <div th:if="${successMessage}" class="alert alert-success mb-lg" th:text="${successMessage}"></div>
                <div th:if="${errorMessage}" class="alert alert-danger mb-lg" th:text="${errorMessage}"></div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px;">
                    <div class="card" th:each="plan : ${plans}">
                        <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                            <div class="card-title" th:text="${plan.name}">Tên gói</div>
                            <span class="badge" 
                                  th:classappend="${plan.active} ? 'badge-success' : 'badge-secondary'"
                                  th:text="${plan.active} ? 'Hoạt động' : 'Vô hiệu'">Trạng thái</span>
                        </div>
                        <div class="card-body">
                            <div style="margin-bottom: 24px;">
                                <div style="font-size: 32px; font-weight: 600; margin-bottom: 4px;">
                                    <span th:if="${plan.price == 0}">Miễn phí</span>
                                    <span th:if="${plan.price > 0}" th:text="${#numbers.formatDecimal(plan.price, 0, 'COMMA', 0, 'POINT')} + '₫'"></span>
                                </div>
                                <div class="text-secondary text-sm" th:if="${plan.price > 0}">mỗi tháng</div>
                                <div class="text-secondary text-sm" th:text="${plan.description}"></div>
                            </div>
                            
                            <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px;">
                                <div class="text-sm" style="display: flex; justify-content: space-between;">
                                    <span class="text-secondary">Số lớp tối đa:</span>
                                    <span th:text="${plan.maxClasses}"></span>
                                </div>
                                <div class="text-sm" style="display: flex; justify-content: space-between;">
                                    <span class="text-secondary">Số học sinh tối đa:</span>
                                    <span th:text="${plan.maxStudents}"></span>
                                </div>
                                <div class="text-sm" style="display: flex; justify-content: space-between;">
                                    <span class="text-secondary">Bài giảng AI/tháng:</span>
                                    <span th:text="${plan.aiLessonsPerMonth}"></span>
                                </div>
                                <div class="text-sm" style="display: flex; justify-content: space-between;">
                                    <span class="text-secondary">Đề thi/tháng:</span>
                                    <span th:text="${plan.testsPerMonth}"></span>
                                </div>
                                <div class="text-sm" style="display: flex; justify-content: space-between;">
                                    <span class="text-secondary">Ngân hàng câu hỏi:</span>
                                    <span th:text="${plan.maxQuestionsBank}"></span>
                                </div>
                                <div class="text-sm" style="display: flex; justify-content: space-between;">
                                    <span class="text-secondary">Chấm bài tự động:</span>
                                    <span th:text="${plan.autoGrading} ? '✓' : '✗'"></span>
                                </div>
                                <div class="text-sm" style="display: flex; justify-content: space-between;">
                                    <span class="text-secondary">Báo cáo nâng cao:</span>
                                    <span th:text="${plan.advancedReports} ? '✓' : '✗'"></span>
                                </div>
                            </div>
                            
                            <div class="action-buttons">
                                <a th:href="@{/admin/plans/{id}/edit(id=${plan.id})}" class="btn btn-sm btn-action btn-edit">Sửa</a>
                                <form th:action="@{/admin/plans/{id}/toggle(id=${plan.id})}" method="post" class="inline-form">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="submit" class="btn btn-sm btn-action" 
                                            th:classappend="${plan.active} ? 'btn-warning' : 'btn-success'"
                                            th:text="${plan.active} ? 'Vô hiệu' : 'Kích hoạt'">Toggle</button>
                                </form>
                                <form th:action="@{/admin/plans/{id}/delete(id=${plan.id})}" method="post" class="inline-form">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="submit" class="btn btn-sm btn-action btn-danger" 
                                            onclick="return confirm('Xóa gói dịch vụ này?')">Xóa</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
