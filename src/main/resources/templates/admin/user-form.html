<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Form - Smart Classroom</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">Smart Classroom</div>
            
            <nav class="sidebar-nav">
                <a href="/admin/dashboard" class="nav-item">Bảng điều khiển</a>
                <a href="/admin/users" class="nav-item active">Ngườii dùng</a>
                <a href="/admin/plans" class="nav-item">Gói dịch vụ</a>
                <a href="/admin/payments" class="nav-item">Thanh toán</a>
                <a href="/admin/questions" class="nav-item">Ngân hàng câu hỏi</a>
                <a href="/admin/lessons" class="nav-item">Bài giảng</a>
                <a href="/admin/tests" class="nav-item">Đề thi</a>
                <a href="/admin/classrooms" class="nav-item">Lớp học</a>
                <a href="/admin/ai-history" class="nav-item">Lịch sử AI</a>
                <a href="/admin/profile" class="nav-item">Cài đặt</a>
            </nav>
            
            <div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-ghost" style="width: 100%;">Đăng xuất</button>
                </form>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div class="header-title">
                    <span th:if="${user.id == null}">Ngườii dùng mới</span>
                    <span th:if="${user.id != null}">Sửa ngườii dùng</span>
                </div>
            </header>

            <div class="content">
                <div style="max-width: 600px;">
                    <div class="card">
                        <div class="card-body">
                            <form th:action="${user.id == null} ? @{/admin/users} : @{/admin/users/{id}(id=${user.id})}" 
                                  method="post" th:object="${user}">
                                
                                <div class="form-group">
                                    <label class="form-label">Email *</label>
                                    <input type="email" th:field="*{email}" class="form-input" required>
                                </div>

                                <div class="form-group">
                                    <label class="form-label">Họ và tên *</label>
                                    <input type="text" th:field="*{fullName}" class="form-input" required>
                                </div>

                                <div class="form-group">
                                    <label class="form-label">Số điện thoại</label>
                                    <input type="text" th:field="*{phone}" class="form-input">
                                </div>

                                <div class="form-group">
                                    <label class="form-label">Mật khẩu <span th:if="${user.id != null}" class="text-secondary">(để trống để giữ nguyên)</span></label>
                                    <input type="password" th:field="*{password}" class="form-input" 
                                           th:required="${user.id == null}">
                                </div>

                                <div class="form-group">
                                    <label class="form-label">Vai trò *</label>
                                    <select th:field="*{role}" class="form-select" required>
                                        <option value="ADMIN">Quản trị viên</option>
                                        <option value="TEACHER">Giáo viên</option>
                                        <option value="STUDENT">Học sinh</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label class="form-label">
                                        <input type="checkbox" th:field="*{active}" style="margin-right: 8px;">
                                        Hoạt động
                                    </label>
                                </div>

                                <div style="display: flex; justify-content: space-between; gap: 12px; margin-top: 24px;">
                                    <a href="/admin/users" class="btn">Hủy</a>
                                    <button type="submit" class="btn btn-primary">
                                        <span th:if="${user.id == null}">Tạo ngườii dùng</span>
                                        <span th:if="${user.id != null}">Cập nhật ngườii dùng</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
