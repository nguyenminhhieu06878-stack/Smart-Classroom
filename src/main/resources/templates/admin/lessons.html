<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bài giảng - Smart Classroom</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">Smart Classroom</div>
            
            <nav class="sidebar-nav">
                <a href="/admin/dashboard" class="nav-item">Bảng điều khiển</a>
                <a href="/admin/users" class="nav-item">Ngườii dùng</a>
                <a href="/admin/plans" class="nav-item">Gói dịch vụ</a>
                <a href="/admin/payments" class="nav-item">Thanh toán</a>
                <a href="/admin/questions" class="nav-item">Ngân hàng câu hỏi</a>
                <a href="/admin/lessons" class="nav-item active">Bài giảng</a>
                <a href="/admin/tests" class="nav-item">Đề thi</a>
                <a href="/admin/classrooms" class="nav-item">Lớp học</a>
                <a href="/admin/ai-history" class="nav-item">Lịch sử AI</a>
                <a href="/admin/profile" class="nav-item">Cài đặt</a>
            </nav>
            
            <div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-ghost" style="width: 100%;">Đăng xuất</button>
                </form>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div class="header-title">Bài giảng</div>
            </header>

            <div class="content">
                <!-- Success/Error Messages -->
                <div th:if="${successMessage}" class="alert alert-success mb-lg" th:text="${successMessage}"></div>
                <div th:if="${errorMessage}" class="alert alert-danger mb-lg" th:text="${errorMessage}"></div>

                <!-- Filter -->
                <div class="card mb-lg">
                    <div class="card-body">
                        <form th:action="@{/admin/lessons}" method="get" style="display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end;">
                            <div class="form-group" style="margin-bottom: 0;">
                                <label class="form-label">Môn học</label>
                                <input type="text" name="subject" th:value="${subject}" class="form-input" placeholder="Tất cả" style="width: 150px;">
                            </div>
                            <div class="form-group" style="margin-bottom: 0;">
                                <label class="form-label">Lớp</label>
                                <input type="text" name="grade" th:value="${grade}" class="form-input" placeholder="Tất cả" style="width: 120px;">
                            </div>
                            <button type="submit" class="btn btn-primary">Lọc</button>
                            <a href="/admin/lessons" class="btn">Xóa lọc</a>
                        </form>
                    </div>
                </div>

                <!-- Lessons Table -->
                <div class="card">
                    <div class="card-body" style="padding: 0;">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Tiêu đề</th>
                                    <th>Môn</th>
                                    <th>Lớp</th>
                                    <th>Chủ đề</th>
                                    <th>Lớp học</th>
                                    <th>Giáo viên</th>
                                    <th>Ngày tạo</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="l : ${lessons}">
                                    <td th:text="${l.id}"></td>
                                    <td>
                                        <div style="max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" 
                                             th:text="${l.title}" th:title="${l.title}"></div>
                                    </td>
                                    <td th:text="${l.subject}"></td>
                                    <td th:text="${l.grade}"></td>
                                    <td th:text="${l.topic}"></td>
                                    <td>
                                        <span th:if="${l.classroom != null}" th:text="${l.classroom.name}"></span>
                                        <span th:if="${l.classroom == null}" class="text-secondary">-</span>
                                    </td>
                                    <td th:text="${l.teacher != null} ? ${l.teacher.fullName} : 'N/A'"></td>
                                    <td th:text="${#temporals.format(l.createdAt, 'dd/MM/yyyy')}"></td>
                                    <td>
                                        <div class="action-buttons">
                                            <a th:href="@{/admin/lessons/{id}(id=${l.id})}" class="btn btn-sm btn-action btn-edit">Xem</a>
                                            <form th:action="@{/admin/lessons/{id}/delete(id=${l.id})}" method="post" class="inline-form">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                <button type="submit" class="btn btn-sm btn-action btn-danger" 
                                                        onclick="return confirm('Xóa bài giảng này?')">Xóa</button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(lessons)}">
                                    <td colspan="9" style="text-align: center; padding: 32px; color: var(--text-secondary);">
                                        Không có bài giảng nào
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
