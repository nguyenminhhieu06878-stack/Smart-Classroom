<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ngân hàng câu hỏi - Smart Classroom</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <img th:src="@{/image.png}" alt="Smart Classroom" class="sidebar-logo-img">
            
            <nav class="sidebar-nav">
                <a href="/admin/dashboard" class="nav-item">Bảng điều khiển</a>
                <a href="/admin/users" class="nav-item">Ngườii dùng</a>
<!--                <a href="/admin/plans" class="nav-item">Gói dịch vụ</a>-->
<!--                <a href="/admin/payments" class="nav-item">Thanh toán</a>-->
                <a href="/admin/questions" class="nav-item active">Ngân hàng câu hỏi</a>
                <a href="/admin/lessons" class="nav-item">Bài giảng</a>
                <a href="/admin/tests" class="nav-item">Đề thi</a>
                <a href="/admin/classrooms" class="nav-item">Lớp học</a>
                <a href="/admin/ai-history" class="nav-item">Lịch sử AI</a>
                <a href="/admin/profile" class="nav-item">Cài đặt</a>
            </nav>
            
            <div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-ghost" style="width: 100%;">Đăng xuất</button>
                </form>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div class="header-title">Ngân hàng câu hỏi</div>
            </header>

            <div class="content">
                <!-- Success/Error Messages -->
                <div th:if="${successMessage}" class="alert alert-success mb-lg" th:text="${successMessage}"></div>
                <div th:if="${errorMessage}" class="alert alert-danger mb-lg" th:text="${errorMessage}"></div>

                <!-- Filter -->
                <div class="card mb-lg">
                    <div class="card-body">
                        <form th:action="@{/admin/questions}" method="get" style="display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end;">
                            <div class="form-group" style="margin-bottom: 0;">
                                <label class="form-label">Môn học</label>
                                <input type="text" name="subject" th:value="${subject}" class="form-input" placeholder="Tất cả" style="width: 150px;">
                            </div>
                            <div class="form-group" style="margin-bottom: 0;">
                                <label class="form-label">Lớp</label>
                                <input type="text" name="grade" th:value="${grade}" class="form-input" placeholder="Tất cả" style="width: 120px;">
                            </div>
                            <div class="form-group" style="margin-bottom: 0;">
                                <label class="form-label">Từ khóa</label>
                                <input type="text" name="keyword" th:value="${keyword}" class="form-input" placeholder="Tìm kiếm..." style="width: 200px;">
                            </div>
                            <button type="submit" class="btn btn-primary">Lọc</button>
                            <a href="/admin/questions" class="btn">Xóa lọc</a>
                        </form>
                    </div>
                </div>

                <!-- Questions Table -->
                <div class="card">
                    <div class="card-body" style="padding: 0;">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nội dung</th>
                                    <th>Môn</th>
                                    <th>Lớp</th>
                                    <th>Độ khó</th>
                                    <th>Loại</th>
                                    <th>Nguồn</th>
                                    <th>Giáo viên</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="q : ${questions}">
                                    <td th:text="${q.id}"></td>
                                    <td>
                                        <div style="max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" 
                                             th:text="${q.content}" th:title="${q.content}"></div>
                                    </td>
                                    <td th:text="${q.subject}"></td>
                                    <td th:text="${q.grade}"></td>
                                    <td>
                                        <span class="badge" 
                                              th:classappend="${q.difficulty.name() == 'EASY'} ? 'badge-success' : (${q.difficulty.name() == 'MEDIUM'} ? 'badge-warning' : 'badge-danger')"
                                              th:text="${q.difficulty.name() == 'EASY'} ? 'Dễ' : (${q.difficulty.name() == 'MEDIUM'} ? 'TB' : 'Khó')">
                                        </span>
                                    </td>
                                    <td>
                                        <span th:switch="${q.questionType.name()}">
                                            <span th:case="'MULTIPLE_CHOICE'">TN</span>
                                            <span th:case="'ESSAY'">TL</span>
                                            <span th:case="'TRUE_FALSE'">Đ/S</span>
                                            <span th:case="'FILL_BLANK'">ĐCT</span>
                                        </span>
                                    </td>
                                    <td>
                                        <span class="badge" 
                                              th:classappend="${q.createdBy.name() == 'AI'} ? 'badge-info' : (${q.createdBy.name() == 'IMPORT'} ? 'badge-warning' : '')"
                                              th:text="${q.createdBy.name() == 'AI'} ? 'AI' : (${q.createdBy.name() == 'IMPORT'} ? 'Import' : 'Thủ công')">
                                        </span>
                                    </td>
                                    <td th:text="${q.teacher != null} ? ${q.teacher.fullName} : 'N/A'"></td>
                                    <td>
                                        <div class="action-buttons">
                                            <a th:href="@{/admin/questions/{id}(id=${q.id})}" class="btn btn-sm btn-action btn-edit">Xem</a>
                                            <form th:action="@{/admin/questions/{id}/delete(id=${q.id})}" method="post" class="inline-form">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                <button type="submit" class="btn btn-sm btn-action btn-danger" 
                                                        onclick="return confirm('Xóa câu hỏi này?')">Xóa</button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(questions)}">
                                    <td colspan="9" style="text-align: center; padding: 32px; color: var(--text-secondary);">
                                        Không có câu hỏi nào
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
