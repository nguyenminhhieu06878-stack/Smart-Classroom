<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lớp học - Smart Classroom</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">Smart Classroom</div>
            
            <nav class="sidebar-nav">
                <a href="/admin/dashboard" class="nav-item">Bảng điều khiển</a>
                <a href="/admin/users" class="nav-item">Ngườii dùng</a>
                <a href="/admin/plans" class="nav-item">Gói dịch vụ</a>
                <a href="/admin/payments" class="nav-item">Thanh toán</a>
                <a href="/admin/questions" class="nav-item">Ngân hàng câu hỏi</a>
                <a href="/admin/lessons" class="nav-item">Bài giảng</a>
                <a href="/admin/tests" class="nav-item">Đề thi</a>
                <a href="/admin/classrooms" class="nav-item active">Lớp học</a>
                <a href="/admin/ai-history" class="nav-item">Lịch sử AI</a>
                <a href="/admin/profile" class="nav-item">Cài đặt</a>
            </nav>
            
            <div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-ghost" style="width: 100%;">Đăng xuất</button>
                </form>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div class="header-title">Lớp học</div>
            </header>

            <div class="content">
                <!-- Success/Error Messages -->
                <div th:if="${successMessage}" class="alert alert-success mb-lg" th:text="${successMessage}"></div>
                <div th:if="${errorMessage}" class="alert alert-danger mb-lg" th:text="${errorMessage}"></div>

                <!-- Classrooms Table -->
                <div class="card">
                    <div class="card-body" style="padding: 0;">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Mã phòng</th>
                                    <th>Tên lớp</th>
                                    <th>Môn</th>
                                    <th>Lớp</th>
                                    <th>Số học sinh</th>
                                    <th>Giáo viên</th>
                                    <th>Trạng thái</th>
                                    <th>Ngày tạo</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="c : ${classrooms}">
                                    <td th:text="${c.id}"></td>
                                    <td>
                                        <code th:text="${c.roomId}" style="background: #f3f4f6; padding: 4px 8px; border-radius: 4px;"></code>
                                    </td>
                                    <td th:text="${c.name}"></td>
                                    <td th:text="${c.subject}"></td>
                                    <td th:text="${c.grade}"></td>
                                    <td th:text="${memberCounts.get(c.id)}"></td>
                                    <td th:text="${c.teacher != null} ? ${c.teacher.fullName} : 'N/A'"></td>
                                    <td>
                                        <span class="badge" 
                                              th:classappend="${c.isActive} ? 'badge-success' : 'badge-secondary'"
                                              th:text="${c.isActive} ? 'Hoạt động' : 'Vô hiệu'">
                                        </span>
                                    </td>
                                    <td th:text="${#temporals.format(c.createdAt, 'dd/MM/yyyy')}"></td>
                                    <td>
                                        <div class="action-buttons">
                                            <a th:href="@{/admin/classrooms/{id}(id=${c.id})}" class="btn btn-sm btn-action btn-edit">Xem</a>
                                            <form th:action="@{/admin/classrooms/{id}/delete(id=${c.id})}" method="post" class="inline-form">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                <button type="submit" class="btn btn-sm btn-action btn-danger" 
                                                        onclick="return confirm('Xóa lớp học này?')">Xóa</button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(classrooms)}">
                                    <td colspan="10" style="text-align: center; padding: 32px; color: var(--text-secondary);">
                                        Không có lớp học nào
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
