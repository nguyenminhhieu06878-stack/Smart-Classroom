<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết lớp học - Smart Classroom</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <img th:src="@{/image.png}" alt="Smart Classroom" class="sidebar-logo-img">
            
            <nav class="sidebar-nav">
                <a href="/admin/dashboard" class="nav-item">Bảng điều khiển</a>
                <a href="/admin/users" class="nav-item">Ngườii dùng</a>
<!--                <a href="/admin/plans" class="nav-item">Gói dịch vụ</a>-->
<!--                <a href="/admin/payments" class="nav-item">Thanh toán</a>-->
                <a href="/admin/questions" class="nav-item">Ngân hàng câu hỏi</a>
                <a href="/admin/lessons" class="nav-item">Bài giảng</a>
                <a href="/admin/tests" class="nav-item">Đề thi</a>
                <a href="/admin/classrooms" class="nav-item active">Lớp học</a>
                <a href="/admin/ai-history" class="nav-item">Lịch sử AI</a>
                <a href="/admin/profile" class="nav-item">Cài đặt</a>
            </nav>
            
            <div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-ghost" style="width: 100%;">Đăng xuất</button>
                </form>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div class="header-title">Chi tiết lớp học</div>
                <div class="header-actions">
                    <a href="/admin/classrooms" class="btn">Quay lại</a>
                </div>
            </header>

            <div class="content">
                <div style="display: grid; gap: 24px;">
                    <!-- Classroom Info -->
                    <div class="card">
                        <div class="card-body">
                            <div style="display: grid; gap: 20px;">
                                <div>
                                    <h2 class="card-title mb-sm" th:text="${classroom.name}"></h2>
                                    <div class="text-secondary" th:text="${classroom.subject} + ' - ' + ${classroom.grade}"></div>
                                </div>

                                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; 
                                            background: #f8f9fa; padding: 16px; border-radius: 8px;">
                                    <div>
                                        <div class="text-sm text-secondary">Mã phòng</div>
                                        <code th:text="${classroom.roomId}" style="background: #e5e7eb; padding: 4px 8px; border-radius: 4px;"></code>
                                    </div>
                                    <div>
                                        <div class="text-sm text-secondary">Số học sinh</div>
                                        <div th:text="${memberCount}"></div>
                                    </div>
                                    <div>
                                        <div class="text-sm text-secondary">Giáo viên</div>
                                        <div th:text="${classroom.teacher != null} ? ${classroom.teacher.fullName} : 'N/A'"></div>
                                    </div>
                                    <div>
                                        <div class="text-sm text-secondary">Trạng thái</div>
                                        <span class="badge" 
                                              th:classappend="${classroom.isActive} ? 'badge-success' : 'badge-secondary'"
                                              th:text="${classroom.isActive} ? 'Hoạt động' : 'Vô hiệu'">
                                        </span>
                                    </div>
                                    <div>
                                        <div class="text-sm text-secondary">Ngày tạo</div>
                                        <div th:text="${#temporals.format(classroom.createdAt, 'dd/MM/yyyy HH:mm')}"></div>
                                    </div>
                                </div>

                                <div th:if="${classroom.description != null && !classroom.description.isEmpty()}">
                                    <h4 class="mb-sm">Mô tả</h4>
                                    <div th:text="${classroom.description}"></div>
                                </div>

                                <!-- Actions -->
                                <div style="display: flex; gap: 12px; margin-top: 16px;">
                                    <form th:action="@{/admin/classrooms/{id}/delete(id=${classroom.id})}" method="post">
                                        <button type="submit" class="btn btn-danger" 
                                                onclick="return confirm('Xóa lớp học này?')">Xóa lớp học</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Members List -->
                    <div class="card" th:if="${!#lists.isEmpty(members)}">
                        <div class="card-header">
                            <div class="card-title">Danh sách học sinh (<span th:text="${memberCount}"></span>)</div>
                        </div>
                        <div class="card-body" style="padding: 0;">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Họ tên</th>
                                        <th>Email</th>
                                        <th>Ngày tham gia</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="m : ${members}">
                                        <td th:text="${m.student.id}"></td>
                                        <td th:text="${m.student.fullName}"></td>
                                        <td th:text="${m.student.email}"></td>
                                        <td th:text="${#temporals.format(m.joinedAt, 'dd/MM/yyyy HH:mm')}"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
