<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đề thi - Smart Classroom</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <img th:src="@{/image.png}" alt="Smart Classroom" class="sidebar-logo-img">
            
            <nav class="sidebar-nav">
                <a href="/admin/dashboard" class="nav-item">Bảng điều khiển</a>
                <a href="/admin/users" class="nav-item">Ngườii dùng</a>
<!--                <a href="/admin/plans" class="nav-item">Gói dịch vụ</a>-->
<!--                <a href="/admin/payments" class="nav-item">Thanh toán</a>-->
                <a href="/admin/questions" class="nav-item">Ngân hàng câu hỏi</a>
                <a href="/admin/lessons" class="nav-item">Bài giảng</a>
                <a href="/admin/tests" class="nav-item active">Đề thi</a>
                <a href="/admin/classrooms" class="nav-item">Lớp học</a>
                <a href="/admin/ai-history" class="nav-item">Lịch sử AI</a>
                <a href="/admin/profile" class="nav-item">Cài đặt</a>
            </nav>
            
            <div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-ghost" style="width: 100%;">Đăng xuất</button>
                </form>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div class="header-title">Đề thi</div>
            </header>

            <div class="content">
                <!-- Success/Error Messages -->
                <div th:if="${successMessage}" class="alert alert-success mb-lg" th:text="${successMessage}"></div>
                <div th:if="${errorMessage}" class="alert alert-danger mb-lg" th:text="${errorMessage}"></div>

                <!-- Filter -->
                <div class="card mb-lg">
                    <div class="card-body">
                        <form th:action="@{/admin/tests}" method="get" style="display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end;">
                            <div class="form-group" style="margin-bottom: 0;">
                                <label class="form-label">Môn học</label>
                                <input type="text" name="subject" th:value="${subject}" class="form-input" placeholder="Tất cả" style="width: 150px;">
                            </div>
                            <div class="form-group" style="margin-bottom: 0;">
                                <label class="form-label">Lớp</label>
                                <input type="text" name="grade" th:value="${grade}" class="form-input" placeholder="Tất cả" style="width: 120px;">
                            </div>
                            <button type="submit" class="btn btn-primary">Lọc</button>
                            <a href="/admin/tests" class="btn">Xóa lọc</a>
                        </form>
                    </div>
                </div>

                <!-- Tests Table -->
                <div class="card">
                    <div class="card-body" style="padding: 0;">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Tiêu đề</th>
                                    <th>Môn</th>
                                    <th>Lớp</th>
                                    <th>Thờii gian</th>
                                    <th>Tổng điểm</th>
                                    <th>Số câu</th>
                                    <th>Lớp học</th>
                                    <th>Giáo viên</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="t : ${tests}">
                                    <td th:text="${t.id}"></td>
                                    <td>
                                        <div style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" 
                                             th:text="${t.title}" th:title="${t.title}"></div>
                                    </td>
                                    <td th:text="${t.subject}"></td>
                                    <td th:text="${t.grade}"></td>
                                    <td th:text="${t.durationMinutes} + ' phút'"></td>
                                    <td th:text="${t.totalPoints}"></td>
                                    <td th:text="${t.testQuestions != null} ? ${t.testQuestions.size()} : 0"></td>
                                    <td>
                                        <span th:if="${t.classroom != null}" th:text="${t.classroom.name}"></span>
                                        <span th:if="${t.classroom == null}" class="text-secondary">-</span>
                                    </td>
                                    <td th:text="${t.teacher != null} ? ${t.teacher.fullName} : 'N/A'"></td>
                                    <td>
                                        <div class="action-buttons">
                                            <a th:href="@{/admin/tests/{id}(id=${t.id})}" class="btn btn-sm btn-action btn-edit">Xem</a>
                                            <form th:action="@{/admin/tests/{id}/delete(id=${t.id})}" method="post" class="inline-form">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                <button type="submit" class="btn btn-sm btn-action btn-danger" 
                                                        onclick="return confirm('Xóa đề thi này?')">Xóa</button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(tests)}">
                                    <td colspan="10" style="text-align: center; padding: 32px; color: var(--text-secondary);">
                                        Không có đề thi nào
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
