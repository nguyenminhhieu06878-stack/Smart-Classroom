<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cài đặt - Smart Classroom Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <img th:src="@{/image.png}" alt="Smart Classroom" class="sidebar-logo-img">
            <nav class="sidebar-nav">
                <a href="/admin/dashboard" class="nav-item">Bảng điều khiển</a>
                <a href="/admin/users" class="nav-item">Ngườii dùng</a>
<!--                <a href="/admin/plans" class="nav-item">Gói dịch vụ</a>-->
<!--                <a href="/admin/payments" class="nav-item">Thanh toán</a>-->
                <a href="/admin/questions" class="nav-item">Ngân hàng câu hỏi</a>
                <a href="/admin/lessons" class="nav-item">Bài giảng</a>
                <a href="/admin/tests" class="nav-item">Đề thi</a>
                <a href="/admin/classrooms" class="nav-item">Lớp học</a>
                <a href="/admin/ai-history" class="nav-item">Lịch sử AI</a>
                <a href="/admin/profile" class="nav-item active">Cài đặt</a>
            </nav>
            <div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-ghost" style="width: 100%;">Đăng xuất</button>
                </form>
            </div>
        </aside>
        <main class="main-content">
            <header class="header">
                <div class="header-title">Cài đặt tài khoản</div>
            </header>
            <div class="content">
                <!-- Success/Error Messages -->
                <div th:if="${successMessage}" class="alert alert-success mb-lg" th:text="${successMessage}"></div>
                <div th:if="${errorMessage}" class="alert alert-danger mb-lg" th:text="${errorMessage}"></div>

                <div style="max-width: 600px;">
                    <div class="card">
                        <div class="card-body">
                            <h3 class="card-title mb-lg">Thông tin cá nhân</h3>
                            <form th:action="@{/admin/profile}" method="post" th:object="${user}">
                                <div class="form-group">
                                    <label class="form-label">Họ và tên</label>
                                    <input type="text" th:field="*{fullName}" class="form-input" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Email</label>
                                    <input type="email" th:field="*{email}" class="form-input" disabled>
                                    <small class="text-secondary text-sm">Email không thể thay đổi</small>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Số điện thoại</label>
                                    <input type="text" th:field="*{phone}" class="form-input">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Giới thiệu</label>
                                    <textarea th:field="*{bio}" class="form-input" rows="3"></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary" style="margin-top: 24px;">
                                    Lưu thay đổi
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
