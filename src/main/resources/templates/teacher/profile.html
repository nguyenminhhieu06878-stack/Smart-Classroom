<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cài đặt - Smart Classroom</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">Smart Classroom</div>
            
            <nav class="sidebar-nav">
                <a href="/teacher/dashboard" class="nav-item">Bảng điều khiển</a>
                <a href="/teacher/classrooms" class="nav-item">Phòng học</a>
                <a href="/teacher/questions" class="nav-item">Ngân hàng câu hỏi</a>
                <a href="/teacher/lessons" class="nav-item">Bài giảng</a>
                <a href="/teacher/tests" class="nav-item">Đề thi</a>
                <a href="/teacher/subscription" class="nav-item">Gói dịch vụ</a>
                <a href="/teacher/profile" class="nav-item active">Cài đặt</a>
            </nav>
            
            <div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-ghost" style="width: 100%;">Đăng xuất</button>
                </form>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div class="header-title">Cài đặt tài khoản</div>
            </header>

            <div class="content">
                <div style="max-width: 800px;">
                    <!-- Current Plan Card -->
                    <div class="card" style="margin-bottom: 24px;" th:if="${activeSubscription != null}">
                        <div class="card-body">
                            <h3 class="card-title mb-lg">Gói dịch vụ hiện tại</h3>
                            
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                                <div>
                                    <div style="font-size: 20px; font-weight: 600;" th:text="${activeSubscription.plan.name}"></div>
                                    <div style="color: var(--text-secondary); font-size: 14px;" th:text="${activeSubscription.plan.description}"></div>
                                </div>
                                <a href="/teacher/subscription" class="btn btn-ghost">Nâng cấp</a>
                            </div>
                            
                            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 16px; background: #f5f5f5; border-radius: 8px;">
                                <div>
                                    <div style="color: var(--text-secondary); font-size: 13px;">Còn lại</div>
                                    <div style="font-size: 18px; font-weight: 600;">
                                        <span th:text="${activeSubscription.daysRemaining}"></span> ngày
                                    </div>
                                </div>
                                <div>
                                    <div style="color: var(--text-secondary); font-size: 13px;">AI bài giảng</div>
                                    <div style="font-size: 18px; font-weight: 600;">
                                        <span th:text="${activeSubscription.aiLessonsUsed != null ? activeSubscription.aiLessonsUsed : 0}"></span>
                                        / <span th:text="${activeSubscription.plan.aiLessonsPerMonth}"></span>
                                    </div>
                                </div>
                                <div>
                                    <div style="color: var(--text-secondary); font-size: 13px;">Đề thi</div>
                                    <div style="font-size: 18px; font-weight: 600;">
                                        <span th:text="${activeSubscription.testsCreated != null ? activeSubscription.testsCreated : 0}"></span>
                                        / <span th:text="${activeSubscription.plan.testsPerMonth}"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="card-body">
                            <h3 class="card-title mb-lg">Thông tin cá nhân</h3>
                            
                            <form th:action="@{/teacher/profile}" method="post" th:object="${user}">
                                <div class="form-group">
                                    <label class="form-label">Họ và tên</label>
                                    <input type="text" th:field="*{fullName}" class="form-input" required>
                                </div>

                                <div class="form-group">
                                    <label class="form-label">Email</label>
                                    <input type="email" th:field="*{email}" class="form-input" disabled>
                                    <small class="text-secondary text-sm">Email không thể thay đổi</small>
                                </div>

                                <div class="form-group">
                                    <label class="form-label">Số điện thoại</label>
                                    <input type="text" th:field="*{phone}" class="form-input">
                                </div>

                                <div class="form-group">
                                    <label class="form-label">Giới thiệu</label>
                                    <textarea th:field="*{bio}" class="form-textarea" rows="4" 
                                              placeholder="Giới thiệu về bản thân, kinh nghiệm giảng dạy..."></textarea>
                                </div>

                                <button type="submit" class="btn btn-primary" style="margin-top: 24px;">
                                    Lưu thay đổi
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
