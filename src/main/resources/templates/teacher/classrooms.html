<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Phòng học - Smart Classroom</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">Smart Classroom</div>
            
            <nav class="sidebar-nav">
                <a href="/teacher/dashboard" class="nav-item">Bảng điều khiển</a>
                <a href="/teacher/classrooms" class="nav-item active">Phòng học</a>
                <a href="/teacher/questions" class="nav-item">Ngân hàng câu hỏi</a>
                <a href="/teacher/lessons" class="nav-item">Bài giảng</a>
                <a href="/teacher/tests" class="nav-item">Đề thi</a>
                <a href="/teacher/subscription" class="nav-item">Gói dịch vụ</a>
                <a href="/teacher/profile" class="nav-item">Cài đặt</a>
            </nav>
            
            <div>
                <div class="user-info">
                    <span th:text="${teacher.fullName}"></span>
                </div>
                <form th:action="@{/logout}" method="post" style="margin-top: 12px;">
                    <button type="submit" class="btn btn-ghost" style="width: 100%;">Đăng xuất</button>
                </form>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div class="header-title">Phòng học</div>
                <a href="/teacher/classrooms/new" class="btn">Tạo phòng học mới</a>
            </header>

            <div class="content">
                <div th:if="${classrooms.isEmpty()}" class="empty-state">
                    <p>Chưa có phòng học nào</p>
                    <a href="/teacher/classrooms/new" class="btn">Tạo phòng học đầu tiên</a>
                </div>

                <div th:if="${!classrooms.isEmpty()}" class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Mã phòng</th>
                                <th>Tên lớp</th>
                                <th>Môn học</th>
                                <th>Khối</th>
                                <th>Học sinh</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="classroom : ${classrooms}">
                                <td>
                                    <code th:text="${classroom.roomId}"></code>
                                </td>
                                <td>
                                    <a th:href="@{/teacher/classrooms/{id}(id=${classroom.id})}" 
                                       th:text="${classroom.name}"
                                       style="color: var(--text-primary); text-decoration: none;">
                                    </a>
                                </td>
                                <td th:text="${classroom.subject}"></td>
                                <td th:text="${classroom.grade}"></td>
                                <td th:text="${memberCounts[classroom.id]}"></td>
                                <td>
                                    <div style="display: flex; gap: 8px;">
                                        <a th:href="@{/teacher/classrooms/{id}(id=${classroom.id})}" class="btn btn-sm">
                                            Chi tiết
                                        </a>
                                        <a th:href="@{/teacher/classrooms/{id}/edit(id=${classroom.id})}" class="btn btn-sm btn-ghost">
                                            Sửa
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
