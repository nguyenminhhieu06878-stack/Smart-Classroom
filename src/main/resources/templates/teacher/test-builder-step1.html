<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tạo đề thi - Bước 1 - Smart Classroom</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">Smart Classroom</div>
            
            <nav class="sidebar-nav">
                <a href="/teacher/dashboard" class="nav-item">Bảng điều khiển</a>
                <a href="/teacher/classrooms" class="nav-item">Phòng học</a>
                <a href="/teacher/questions" class="nav-item">Ngân hàng câu hỏi</a>
                <a href="/teacher/lessons" class="nav-item">Bài giảng</a>
                <a href="/teacher/tests" class="nav-item active">Đề thi</a>
                <a href="/teacher/profile" class="nav-item">Cài đặt</a>
            </nav>
            
            <div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-ghost" style="width: 100%;">Đăng xuất</button>
                </form>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div class="header-title">Tạo đề thi từ ngân hàng câu hỏi</div>
            </header>

            <div class="content">
                <div style="max-width: 800px;">
                    <!-- Progress Steps -->
                    <div style="display: flex; justify-content: space-between; margin-bottom: 32px; padding: 0 20px;">
                        <div style="flex: 1; text-align: center;">
                            <div style="width: 40px; height: 40px; border-radius: 50%; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px;">1</div>
                            <div style="font-size: 14px; font-weight: 500;">Thông tin cơ bản</div>
                        </div>
                        <div style="flex: 1; text-align: center; opacity: 0.4;">
                            <div style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid #ddd; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px;">2</div>
                            <div style="font-size: 14px;">Thiết kế ma trận</div>
                        </div>
                        <div style="flex: 1; text-align: center; opacity: 0.4;">
                            <div style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid #ddd; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px;">3</div>
                            <div style="font-size: 14px;">Chọn câu hỏi</div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-body">
                            <h3 class="card-title mb-lg">Bước 1: Thông tin cơ bản</h3>
                            
                            <form th:action="@{/teacher/tests/builder/step2}" method="post">
                                <div class="form-group">
                                    <label class="form-label">Tiêu đề đề thi</label>
                                    <input type="text" name="title" class="form-input" 
                                           placeholder="Ví dụ: Kiểm tra giữa kỳ I - Toán 1" required>
                                </div>

                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                                    <div class="form-group">
                                        <label class="form-label">Môn học</label>
                                        <select name="subject" class="form-select" required>
                                            <option value="">Chọn môn học</option>
                                            <option value="Toán">Toán</option>
                                            <option value="Tiếng Việt">Tiếng Việt</option>
                                            <option value="Tiếng Anh">Tiếng Anh</option>
                                            <option value="Khoa học">Khoa học</option>
                                            <option value="Lịch sử">Lịch sử</option>
                                        </select>
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label">Lớp</label>
                                        <select name="grade" class="form-select" required>
                                            <option value="">Chọn lớp</option>
                                            <option value="Lớp 1">Lớp 1</option>
                                            <option value="Lớp 2">Lớp 2</option>
                                            <option value="Lớp 3">Lớp 3</option>
                                            <option value="Lớp 4">Lớp 4</option>
                                            <option value="Lớp 5">Lớp 5</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label class="form-label">Thời gian làm bài (phút)</label>
                                    <input type="number" name="duration" class="form-input" 
                                           value="45" min="1" required>
                                </div>

                                <div class="form-group">
                                    <label class="form-label">Nguồn câu hỏi</label>
                                    <select name="questionSource" class="form-select" required>
                                        <option value="bank">Từ ngân hàng câu hỏi</option>
                                        <option value="ai">Tạo bằng AI</option>
                                        <option value="mixed">Kết hợp cả hai</option>
                                    </select>
                                    <p class="text-sm text-secondary" style="margin-top: 8px;">
                                        Chọn nguồn để lấy câu hỏi cho đề thi
                                    </p>
                                </div>

                                <div style="display: flex; justify-content: space-between; gap: 12px; margin-top: 32px;">
                                    <a href="/teacher/tests" class="btn">Hủy</a>
                                    <button type="submit" class="btn btn-primary">Tiếp theo →</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
