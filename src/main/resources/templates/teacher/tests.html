<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đề thi - Smart Classroom</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">Smart Classroom</div>
            
            <nav class="sidebar-nav">
                <a href="/teacher/dashboard" class="nav-item">Bảng điều khiển</a>
                <a href="/teacher/classrooms" class="nav-item">Phòng học</a>
                <a href="/teacher/questions" class="nav-item">Ngân hàng câu hỏi</a>
                <a href="/teacher/lessons" class="nav-item">Bài giảng</a>
                <a href="/teacher/tests" class="nav-item active">Đề thi</a>
                <a href="/teacher/subscription" class="nav-item">Gói dịch vụ</a>
                <a href="/teacher/profile" class="nav-item">Cài đặt</a>
            </nav>
            
            <div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-ghost" style="width: 100%;">Đăng xuất</button>
                </form>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div class="header-title">Đề thi</div>
                <div class="header-actions">
                    <a href="/teacher/tests/builder/step1" class="btn btn-primary">Tạo đề thi</a>
                </div>
            </header>

            <div class="content">
                <!-- Empty State -->
                <div th:if="${#lists.isEmpty(tests)}" class="empty-state">
                    <div class="empty-state-title">Chưa có đề thi nào</div>
                    <p>Tạo đề thi từ ngân hàng câu hỏi hoặc dùng AI</p>
                    <div style="display: flex; gap: 12px; justify-content: center; margin-top: 24px;">
                        <a href="/teacher/tests/builder/step1" class="btn">Tạo từ ngân hàng</a>
                        <a href="/teacher/tests/ai-generate" class="btn">Tạo với AI</a>
                        <a href="/teacher/tests/new" class="btn btn-primary">Đề thi mới</a>
                    </div>
                </div>

                <!-- Tests Table -->
                <div th:if="${!#lists.isEmpty(tests)}" class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Tiêu đề</th>
                                <th>Môn học</th>
                                <th>Lớp</th>
                                <th>Thời gian</th>
                                <th>Tổng điểm</th>
                                <th>Ngày tạo</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="test : ${tests}">
                                <td th:text="${test.title}"></td>
                                <td th:text="${test.subject}"></td>
                                <td th:text="${test.grade}"></td>
                                <td>
                                    <span th:if="${test.durationMinutes}" 
                                          th:text="${test.durationMinutes} + ' phút'"></span>
                                </td>
                                <td th:text="${test.totalPoints}"></td>
                                <td class="text-sm text-secondary" 
                                    th:text="${#temporals.format(test.createdAt, 'dd/MM/yyyy')}"></td>
                                <td>
                                    <div style="display: flex; gap: 8px;">
                                        <a th:href="@{/teacher/tests/{id}(id=${test.id})}" class="btn btn-sm">Xem</a>
                                        <a th:href="@{/teacher/tests/{id}/edit(id=${test.id})}" class="btn btn-sm">Sửa</a>
                                        <form th:action="@{/teacher/tests/{id}/delete(id=${test.id})}" method="post" style="display: inline;">
                                            <button type="submit" class="btn btn-sm" 
                                                    onclick="return confirm('Bạn có chắc muốn xóa đề thi này?')">Xóa</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
