<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Generate Lesson with AI - Smart Classroom</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">Smart Classroom</div>
            
            <nav class="sidebar-nav">
                <a href="/teacher/dashboard" class="nav-item">Bảng điều khiển</a>
                <a href="/teacher/classrooms" class="nav-item">Phòng học</a>
                <a href="/teacher/questions" class="nav-item">Ngân hàng câu hỏi</a>
                <a href="/teacher/lessons" class="nav-item active">Bài giảng</a>
                <a href="/teacher/tests" class="nav-item">Đề thi</a>
                <a href="/teacher/profile" class="nav-item">Cài đặt</a>
            </nav>
            
            <div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-ghost" style="width: 100%;">Đăng xuất</button>
                </form>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div class="header-title">Tạo bài giảng với AI</div>
            </header>

            <div class="content">
                <div style="max-width: 600px;">
                    <div class="card">
                        <div class="card-body">
                            <form th:action="@{/teacher/lessons/ai-generate}" method="post">
                                <div class="form-group">
                                    <label class="form-label">Môn học</label>
                                    <select name="subject" class="form-select" required>
                                        <option value="Toán">Toán</option>
                                        <option value="Tiếng Việt">Tiếng Việt</option>
                                        <option value="Tiếng Anh">Tiếng Anh</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label class="form-label">Lớp</label>
                                    <select name="grade" class="form-select" required>
                                        <option value="Lớp 1">Lớp 1</option>
                                        <option value="Lớp 2">Lớp 2</option>
                                        <option value="Lớp 3">Lớp 3</option>
                                        <option value="Lớp 4">Lớp 4</option>
                                        <option value="Lớp 5">Lớp 5</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label class="form-label">Chủ đề</label>
                                    <input type="text" name="topic" class="form-input" 
                                           placeholder="Ví dụ: Phép cộng trong phạm vi 100" required>
                                </div>

                                <div class="form-group">
                                    <label class="form-label">Mục tiêu học tập</label>
                                    <textarea name="objectives" class="form-textarea" rows="4" 
                                              placeholder="Học sinh cần học được gì từ bài giảng này?" required></textarea>
                                </div>

                                <div class="alert alert-info">
                                    AI sẽ tạo giáo án chi tiết bao gồm mục tiêu, nội dung, 
                                    hoạt động và câu hỏi đánh giá. Quá trình có thể mất 15-30 giây.
                                </div>

                                <div style="display: flex; justify-content: space-between; gap: 12px;">
                                    <a href="/teacher/lessons" class="btn">Hủy</a>
                                    <button type="submit" class="btn btn-primary">Tạo với AI</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
