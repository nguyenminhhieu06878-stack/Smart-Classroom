<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tạo câu hỏi với AI - Smart Classroom</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">Smart Classroom</div>
            
            <nav class="sidebar-nav">
                <a href="/teacher/dashboard" class="nav-item">Bảng điều khiển</a>
                <a href="/teacher/classrooms" class="nav-item">Phòng học</a>
                <a href="/teacher/questions" class="nav-item active">Ngân hàng câu hỏi</a>
                <a href="/teacher/lessons" class="nav-item">Bài giảng</a>
                <a href="/teacher/tests" class="nav-item">Đề thi</a>
                <a href="/teacher/profile" class="nav-item">Cài đặt</a>
            </nav>
            
            <div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-ghost" style="width: 100%;">Đăng xuất</button>
                </form>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div class="header-title">Tạo câu hỏi với AI</div>
            </header>

            <div class="content">
                <div style="max-width: 600px;">
                    <div class="card">
                        <div class="card-body">
                            <form th:action="@{/teacher/questions/ai-generate}" method="post">
                                <div class="form-group">
                                    <label class="form-label">Môn học</label>
                                    <select name="subject" class="form-select" required>
                                        <option value="Toán">Toán</option>
                                        <option value="Tiếng Việt">Tiếng Việt</option>
                                        <option value="Tiếng Anh">Tiếng Anh</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label class="form-label">Lớp</label>
                                    <select name="grade" class="form-select" required>
                                        <option value="Lớp 1">Lớp 1</option>
                                        <option value="Lớp 2">Lớp 2</option>
                                        <option value="Lớp 3">Lớp 3</option>
                                        <option value="Lớp 4">Lớp 4</option>
                                        <option value="Lớp 5">Lớp 5</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label class="form-label">Chủ đề</label>
                                    <input type="text" name="topic" class="form-input" 
                                           placeholder="VD: Phép cộng trong phạm vi 100" required>
                                </div>

                                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;">
                                    <div class="form-group">
                                        <label class="form-label">Dễ</label>
                                        <input type="number" name="easyCount" class="form-input" value="3" min="0" max="20">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">Trung bình</label>
                                        <input type="number" name="mediumCount" class="form-input" value="2" min="0" max="20">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">Khó</label>
                                        <input type="number" name="hardCount" class="form-input" value="1" min="0" max="20">
                                    </div>
                                </div>

                                <div class="alert alert-info">
                                    AI sẽ tạo câu hỏi và tự động lưu vào ngân hàng của bạn. 
                                    Quá trình có thể mất 10-30 giây.
                                </div>

                                <div style="display: flex; justify-content: space-between; gap: 12px;">
                                    <a href="/teacher/questions" class="btn">Hủy</a>
                                    <button type="submit" class="btn btn-primary">Tạo với AI</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
