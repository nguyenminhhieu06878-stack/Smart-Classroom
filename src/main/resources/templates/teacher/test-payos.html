<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Test PayOS API</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div style="max-width: 800px; margin: 50px auto; padding: 20px;">
        <h1>Test PayOS API</h1>
        
        <div class="card" style="margin-bottom: 20px;">
            <div class="card-body">
                <h3>Request Info</h3>
                <pre style="background: #f5f5f5; padding: 16px; border-radius: 8px; overflow-x: auto;" th:text="${requestInfo}"></pre>
            </div>
        </div>
        
        <div class="card" style="margin-bottom: 20px;">
            <div class="card-body">
                <h3>Response Status: <span th:text="${responseStatus}"></span></h3>
                <pre style="background: #f5f5f5; padding: 16px; border-radius: 8px; overflow-x: auto;" th:text="${responseBody}"></pre>
            </div>
        </div>
        
        <div class="card" th:if="${error}">
            <div class="card-body">
                <h3 style="color: red;">Error</h3>
                <pre style="background: #fee; padding: 16px; border-radius: 8px; overflow-x: auto;" th:text="${error}"></pre>
            </div>
        </div>
        
        <a href="/teacher/subscription" class="btn">Quay lại</a>
    </div>
</body>
</html>
