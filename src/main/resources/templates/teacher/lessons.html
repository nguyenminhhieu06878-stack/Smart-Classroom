<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bài giảng - Smart Classroom</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">Smart Classroom</div>
            
            <nav class="sidebar-nav">
                <a href="/teacher/dashboard" class="nav-item">Bảng điều khiển</a>
                <a href="/teacher/classrooms" class="nav-item">Phòng học</a>
                <a href="/teacher/questions" class="nav-item">Ngân hàng câu hỏi</a>
                <a href="/teacher/lessons" class="nav-item active">Bài giảng</a>
                <a href="/teacher/tests" class="nav-item">Đề thi</a>
                <a href="/teacher/subscription" class="nav-item">Gói dịch vụ</a>
                <a href="/teacher/profile" class="nav-item">Cài đặt</a>
            </nav>
            
            <div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-ghost" style="width: 100%;">Đăng xuất</button>
                </form>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div class="header-title">Bài giảng</div>
                <div class="header-actions">
                    <a href="/teacher/lessons/ai-generate" class="btn">Tạo với AI</a>
                    <a href="/teacher/lessons/new" class="btn btn-primary">Bài giảng mới</a>
                </div>
            </header>

            <div class="content">
                <!-- Empty State -->
                <div th:if="${#lists.isEmpty(lessons)}" class="empty-state">
                    <div class="empty-state-title">Chưa có bài giảng nào</div>
                    <p>Tạo bài giảng đầu tiên hoặc sử dụng AI để tạo</p>
                    <div style="display: flex; gap: 12px; justify-content: center; margin-top: 24px;">
                        <a href="/teacher/lessons/ai-generate" class="btn">Tạo với AI</a>
                        <a href="/teacher/lessons/new" class="btn btn-primary">Bài giảng mới</a>
                    </div>
                </div>

                <!-- Lessons Grid -->
                <div th:if="${!#lists.isEmpty(lessons)}" 
                     style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px;">
                    <div class="card" th:each="lesson : ${lessons}">
                        <div class="card-body">
                            <h3 class="card-title mb-sm" th:text="${lesson.title}">Tiêu đề bài giảng</h3>
                            <div class="text-sm text-secondary mb-md">
                                <span th:text="${lesson.subject}"></span> • 
                                <span th:text="${lesson.grade}"></span>
                            </div>
                            <p class="text-sm text-secondary mb-lg" 
                               th:text="${#strings.abbreviate(lesson.content, 120)}">
                                Nội dung bài giảng...
                            </p>
                            <div style="display: flex; gap: 8px;">
                                <a th:href="@{/teacher/lessons/{id}(id=${lesson.id})}" class="btn btn-sm">Xem</a>
                                <a th:href="@{/teacher/lessons/{id}/edit(id=${lesson.id})}" class="btn btn-sm">Sửa</a>
                                <form th:action="@{/teacher/lessons/{id}/delete(id=${lesson.id})}" method="post" style="display: inline;">
                                    <button type="submit" class="btn btn-sm" 
                                            onclick="return confirm('Bạn có chắc muốn xóa bài giảng này?')">Xóa</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
