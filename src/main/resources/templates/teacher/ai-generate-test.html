<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tạo đề thi với AI - Smart Classroom</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <img th:src="@{/image.png}" alt="Smart Classroom" class="sidebar-logo-img">
            
            <nav class="sidebar-nav">
                <a href="/teacher/dashboard" class="nav-item">Bảng điều khiển</a>
                <a href="/teacher/classrooms" class="nav-item">Phòng học</a>
                <a href="/teacher/questions" class="nav-item">Ngân hàng câu hỏi</a>
                <a href="/teacher/lessons" class="nav-item">Bài giảng</a>
                <a href="/teacher/tests" class="nav-item active">Đề thi</a>
                <a href="/teacher/profile" class="nav-item">Cài đặt</a>
            </nav>
            
            <div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-ghost" style="width: 100%;">Đăng xuất</button>
                </form>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div class="header-title">Tạo đề thi với AI</div>
            </header>

            <div class="content">
                <div style="max-width: 600px;">
                    <div class="card">
                        <div class="card-body">
                            <form th:action="@{/teacher/tests/ai-generate}" method="post">
                                <div class="form-group">
                                    <label class="form-label">Tiêu đề</label>
                                    <input type="text" name="title" class="form-input" 
                                           th:value="${title}" placeholder="Tiêu đề đề thi" required>
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label">Môn học</label>
                                    <select name="subject" class="form-select" th:value="${subject}" required>
                                        <option value="Toán" th:selected="${subject == 'Toán'}">Toán</option>
                                        <option value="Tiếng Việt" th:selected="${subject == 'Tiếng Việt'}">Tiếng Việt</option>
                                        <option value="Tiếng Anh" th:selected="${subject == 'Tiếng Anh'}">Tiếng Anh</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label class="form-label">Lớp</label>
                                    <select name="grade" class="form-select" th:value="${grade}" required>
                                        <option value="Lớp 3" th:selected="${grade == 'Lớp 3'}">Lớp 3</option>
                                        <option value="Lớp 4" th:selected="${grade == 'Lớp 4'}">Lớp 4</option>
                                        <option value="Lớp 5" th:selected="${grade == 'Lớp 5'}">Lớp 5</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label class="form-label">Chủ đề</label>
                                    <input type="text" name="topic" class="form-input" 
                                           placeholder="Ví dụ: Phép cộng và phép trừ" required>
                                </div>

                                <div class="form-group">
                                    <label class="form-label">Thời gian (phút)</label>
                                    <input type="number" name="duration" class="form-input" 
                                           th:value="${duration != null ? duration : 45}" min="1" required>
                                </div>

                                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;">
                                    <div class="form-group">
                                        <label class="form-label">Câu dễ</label>
                                        <input type="number" name="easyCount" class="form-input" 
                                               value="3" min="0" required>
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label">Câu trung bình</label>
                                        <input type="number" name="mediumCount" class="form-input" 
                                               value="2" min="0" required>
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label">Câu khó</label>
                                        <input type="number" name="hardCount" class="form-input" 
                                               value="1" min="0" required>
                                    </div>
                                </div>

                                <div class="alert alert-info">
                                    AI sẽ tạo đề thi hoàn chỉnh với ma trận đề thi và câu hỏi theo yêu cầu. 
                                    Quá trình có thể mất 20-40 giây.
                                </div>

                                <div style="display: flex; justify-content: space-between; gap: 12px;">
                                    <a href="/teacher/tests" class="btn">Hủy</a>
                                    <button type="submit" class="btn btn-primary">Tạo với AI</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
