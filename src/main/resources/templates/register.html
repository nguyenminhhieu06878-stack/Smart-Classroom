<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Smart Classroom</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .register-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-bg-secondary);
            padding: 20px;
        }
        .register-box {
            width: 100%;
            max-width: 480px;
        }
        .register-card {
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: 40px;
        }
        .register-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }
        .register-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: var(--spacing-sm);
        }
        .register-subtitle {
            font-size: 14px;
            color: var(--color-text-secondary);
        }
        .btn-register {
            width: 100%;
            height: 44px;
            margin-top: var(--spacing-md);
        }
        .login-link {
            text-align: center;
            margin-top: var(--spacing-lg);
            font-size: 14px;
            color: var(--color-text-secondary);
        }
        .login-link a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 500;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-box">
            <div class="register-card">
                <div class="register-header">
                    <div class="register-title">Đăng ký tài khoản</div>
                    <div class="register-subtitle">Tạo tài khoản mới để sử dụng Smart Classroom</div>
                </div>
                
                <div th:if="${error}" class="alert alert-error" style="margin-bottom: 20px;">
                    <span th:text="${error}"></span>
                </div>
                
                <div th:if="${success}" class="alert alert-success" style="margin-bottom: 20px;">
                    <span th:text="${success}"></span>
                </div>
                
                <form th:action="@{/register}" method="post" id="registerForm">
                    <!-- Role Selection -->
                    <div class="form-group">
                        <label class="form-label">Bạn là</label>
                        <select name="role" id="role" class="form-input" required>
                            <option value="">Chọn vai trò...</option>
                            <option value="TEACHER">Giáo viên</option>
                            <option value="STUDENT">Học sinh</option>
                        </select>
                    </div>
                    
                    <!-- Basic Info -->
                    <div class="form-group">
                        <label class="form-label">Họ và tên</label>
                        <input type="text" name="fullName" class="form-input" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Địa chỉ email</label>
                        <input type="email" name="email" class="form-input" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Mật khẩu</label>
                        <input type="password" name="password" class="form-input" required minlength="6">
                        <small style="color: var(--color-text-secondary); font-size: 12px;">Tối thiểu 6 ký tự</small>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Xác nhận mật khẩu</label>
                        <input type="password" name="confirmPassword" class="form-input" required minlength="6">
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-register">Đăng ký</button>
                </form>
                
                <div class="login-link">
                    Đã có tài khoản? <a th:href="@{/login}">Đăng nhập ngay</a>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Validate password match
        const form = document.getElementById('registerForm');
        form.addEventListener('submit', function(e) {
            const password = document.querySelector('input[name="password"]').value;
            const confirmPassword = document.querySelector('input[name="confirmPassword"]').value;
            
            if (password !== confirmPassword) {
                e.preventDefault();
                alert('Mật khẩu xác nhận không khớp!');
            }
        });
    </script>
</body>
</html>
