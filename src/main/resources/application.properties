# Application
spring.application.name=Smart Classroom Platform
server.port=1002

# Database - H2 (Development)
spring.datasource.url=jdbc:h2:mem:smartclass
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Database - PostgreSQL (Production - uncomment khi deploy)
#spring.datasource.url=jdbc:postgresql://localhost:5432/smartclass
#spring.datasource.username=postgres
#spring.datasource.password=your_password
#spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AI Configuration
# Chọn provider: groq hoặc openai
ai.provider=groq

# Groq API (Miễn phí, nhanh) - Đăng ký tại: https://console.groq.com
groq.api.key=YOUR_GROQ_API_KEY_HERE
groq.model=llama-3.3-70b-versatile

# OpenAI API (Trả phí)
openai.api.key=YOUR_OPENAI_API_KEY_HERE
openai.model=gpt-4

# Logging
logging.level.root=INFO
logging.level.com.smartclass=DEBUG
logging.level.org.springframework.security=DEBUG

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# PayOS Configuration
# Đăng ký tại: https://payos.vn
payos.client-id=YOUR_PAYOS_CLIENT_ID
payos.api-key=YOUR_PAYOS_API_KEY
payos.checksum-key=YOUR_PAYOS_CHECKSUM_KEY
app.base-url=http://localhost:1002
