# Application
spring.application.name=Smart Classroom Platform
server.port=1002

# Tomcat Upload Configuration
server.tomcat.max-swallow-size=100MB
server.tomcat.max-http-form-post-size=100MB

# ===========================================
# PROFILE: dev (H2 Database - Default)
# ===========================================
# Chạy với: mvn spring-boot:run
# Hoặc: java -jar -Dspring.profiles.active=dev app.jar

# ===========================================
# PROFILE: docker (PostgreSQL)
# ===========================================
# Chạy với: mvn spring-boot:run -Dspring-boot.run.profiles=docker
# Hoặc: java -jar -Dspring.profiles.active=docker app.jar

# ===========================================
# ACTIVE PROFILE
# ===========================================
spring.profiles.active=dev

# ===========================================
# JPA/Hibernate (Common)
# ===========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===========================================
# Thymeleaf
# ===========================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ===========================================
# File Upload
# ===========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Tomcat Upload Configuration
server.tomcat.max-swallow-size=524288000
server.tomcat.max-http-form-post-size=524288000

# Video Upload Configuration
app.upload.dir=uploads/videos
app.upload.allowed-types=video/mp4,video/webm,video/ogg

# ===========================================
# AI Configuration
# ===========================================
# Chọn provider: groq hoặc openai
ai.provider=groq

# Groq API (Miễn phí, nhanh) - Đăng ký tại: https://console.groq.com
groq.api.key=YOUR_GROQ_API_KEY_HERE
groq.model=llama-3.3-70b-versatile

# OpenAI API (Trả phí)
openai.api.key=YOUR_OPENAI_API_KEY_HERE
openai.model=gpt-4

# ===========================================
# Logging
# ===========================================
logging.level.root=INFO
logging.level.com.smartclass=DEBUG
logging.level.org.springframework.security=DEBUG

# ===========================================
# Encoding
# ===========================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===========================================
# PayOS Configuration
# ===========================================
# Đăng ký tại: https://payos.vn
payos.client-id=YOUR_PAYOS_CLIENT_ID
payos.api-key=YOUR_PAYOS_API_KEY
payos.checksum-key=YOUR_PAYOS_CHECKSUM_KEY
app.base-url=http://localhost:1002
