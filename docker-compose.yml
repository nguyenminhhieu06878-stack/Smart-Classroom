version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smartclass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartclass
      POSTGRES_USER: smartclass
      POSTGRES_PASSWORD: smartclass123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartclass -d smartclass"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Adminer - Database management tool
  adminer:
    image: adminer:latest
    container_name: smartclass-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
